name: Independent keyboard IPA
on:
  workflow_dispatch:
  push:
    branches: [standalone-keyboard-v1]
    paths:
      - 'standalone-keyboard/**'
      - '.github/workflows/standalone-keyboard.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: standalone-keyboard
    steps:
      - uses: actions/checkout@v4
      - name: Core behavior and persistence checks
        run: |
          swiftc -parse-as-library Shared/Core.swift Tests/CoreChecks.swift -o /tmp/suiyan-checks
          /tmp/suiyan-checks
      - name: Generate independent Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build real iPhone app and keyboard
        run: |
          xcodebuild -project Suiyan.xcodeproj -scheme Suiyan -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -120 build.log; exit 1; }
      - name: Verify package and prepare IPA
        run: |
          python3 tools_package.py
          cd build/package
          ditto -c -k --keepParent Payload ../suiyan-independent-0.1.1-unsigned.ipa
          cd ..
          shasum -a 256 suiyan-independent-0.1.1-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: suiyan-independent-iphone-0.1.1
          path: |
            standalone-keyboard/build/suiyan-independent-0.1.1-unsigned.ipa
            standalone-keyboard/build/SHA256SUMS.txt
            standalone-keyboard/TESTING.md
          if-no-files-found: error
          retention-days: 30
