name: iOS source preview

on:
  workflow_dispatch:
  push:
    paths:
      - "integrations/jev_ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "integrations/jev_ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - uses: actions/checkout@v4
      - name: Offline core and project checks
        run: bash tools/check.sh
      - name: Build companion app and keyboard for simulator
        run: >-
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      - name: Compile device targets without distribution signing
        run: >-
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO build
      - name: Archive simulator app with executable permissions
        run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/GoutouJunshi.app build/goutoujunshi-ios-simulator-preview.zip
      - name: Upload simulator app for development only
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-ios-simulator-preview
          path: integrations/jev_ios/build/goutoujunshi-ios-simulator-preview.zip
          if-no-files-found: error
      - name: Package unsigned iPhone IPA with extensions
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Debug-iphoneos/GoutouJunshi.app"
          test -d "$APP/PlugIns/GoutouKeyboard.appex"
          test -d "$APP/PlugIns/GoutouCapture.appex"
          for BUNDLE in "$APP" "$APP"/PlugIns/*.appex; do
            PLATFORM=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$BUNDLE/Info.plist")
            test "$PLATFORM" = "iPhoneOS"
            EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$BUNDLE/Info.plist")
            test -x "$BUNDLE/$EXECUTABLE"
            lipo "$BUNDLE/$EXECUTABLE" -verify_arch arm64
          done
          mkdir -p build-device/ipa/Payload
          ditto "$APP" build-device/ipa/Payload/GoutouJunshi.app
          cd build-device/ipa
          ditto -c -k --keepParent Payload ../goutoujunshi-ios-device-unsigned.ipa
          cd ..
          shasum -a 256 goutoujunshi-ios-device-unsigned.ipa > SHA256SUMS-IPA.txt
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-ios-device-unsigned
          path: |
            integrations/jev_ios/build-device/goutoujunshi-ios-device-unsigned.ipa
            integrations/jev_ios/build-device/SHA256SUMS-IPA.txt
          if-no-files-found: error
          retention-days: 14
